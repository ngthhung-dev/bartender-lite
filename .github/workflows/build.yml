name: Build installers

# Quy ước đặt tên (giống PDF Editor Lite):
#   tag      : v<version>-build<N>          (vd v1.0.0-build42)
#   release  : Bartender Lite <version> (build <N>)
#   file cài : Bartender-Lite-<version>-build<N>-Setup.exe
#              Bartender-Lite-<version>-build<N>-macOS-AppleSilicon.pkg
#              Bartender-Lite-<version>-build<N>-macOS-Intel.pkg
#              bartender-lite_<version>-build<N>_amd64.deb
# <N> = github.run_number trừ mốc BASE trong job setup (reset về build 1 sau run 13).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.n.outputs.build }}
    steps:
      - id: n
        # Đặt lại số build về 1: run_number trừ đi mốc BASE (đã dùng tới run 13).
        # Muốn reset lần nữa: tăng BASE = run_number của lần chạy cuối.
        run: |
          BASE=13
          echo "build=$(( ${{ github.run_number }} - BASE ))" >> "$GITHUB_OUTPUT"
  build:
    needs: setup
    env:
      BUILD_NUMBER: ${{ needs.setup.outputs.build }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: --win nsis --x64
          - os: ubuntu-latest
            name: linux
            args: --linux deb --x64
          - os: macos-latest
            name: macos
            args: --mac dir --x64 --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Đóng gói .pkg macOS
        if: matrix.name == 'macos'
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          mkdir -p out
          for pair in "mac:Intel" "mac-arm64:AppleSilicon"; do
            dir="${pair%%:*}"; label="${pair##*:}"
            pkgbuild --component "dist/$dir/Bartender Lite.app" --install-location /Applications \
              --identifier com.ngthhung.bartenderlite --version "$V" \
              "dist/Bartender-Lite-$V-build$BUILD_NUMBER-macOS-$label.pkg"
          done
          ls -la dist/*.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.deb
            dist/*.pkg

  release:
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Lấy version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}-build${{ needs.setup.outputs.build }}
          name: Bartender Lite ${{ steps.v.outputs.version }} (build ${{ needs.setup.outputs.build }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*
          body: |
            Bo cai tao tu dong (dong Bartender Lite truoc khi cai):

            - Windows 64-bit: file ...-Setup.exe
            - macOS may chip Apple (M1 tro len): file ...-macOS-AppleSilicon.pkg
            - macOS may chip Intel: file ...-macOS-Intel.pkg
            - Linux Mint / Ubuntu / Debian 64-bit: file .deb
              macOS: bo cai chua co chu ky Apple, lan dau bam chuot phai vao file .pkg > Open (hoac System Settings > Privacy & Security > Open Anyway).
