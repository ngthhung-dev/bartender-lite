name: Build installers

# Quy ước phiên bản (giống các app khác của ngthhung): mỗi lần chạy tự tăng từ bản phát hành gần nhất
#   1.0.1 → 1.0.2 → … → 1.0.99 → 1.1.0 → … → 1.99.99 → 2.0.0
#   tag      : v<version>                 (vd v1.0.1)
#   release  : Bartender Lite <version>
#   file cài : Bartender-Lite-<version>-Setup.exe
#              Bartender-Lite-<version>-macOS-AppleSilicon.pkg
#              Bartender-Lite-<version>-macOS-Intel.pkg
#              bartender-lite_<version>_amd64.deb
# Chạy tay có thể tự nhập phiên bản.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tự nhập phiên bản (vd 1.2.3). Để trống = tự tăng từ bản phát hành gần nhất'
        required: false
        default: ''
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Phiên bản kế tiếp
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"; V="${V#v}"
          else
            # bản gần nhất (bỏ đuôi -buildN của các tag cũ); chưa có thì coi như 1.0.0
            LAST=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/v##; s#-build.*##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            LAST=${LAST:-1.0.0}
            IFS=. read -r MA MI PA <<< "$LAST"
            PA=$((PA + 1))
            if [ "$PA" -gt 99 ]; then PA=0; MI=$((MI + 1)); fi
            if [ "$MI" -gt 99 ]; then MI=0; MA=$((MA + 1)); fi
            V="$MA.$MI.$PA"
            echo "Bản gần nhất: $LAST"
          fi
          echo "Phiên bản: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
  build:
    needs: setup
    env:
      APP_VERSION: ${{ needs.setup.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: --win nsis --x64
          - os: ubuntu-latest
            name: linux
            args: --linux deb --x64
          - os: macos-latest
            name: macos
            args: --mac dir --x64 --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Gắn phiên bản vào ứng dụng
        shell: bash
        run: npm version "$APP_VERSION" --no-git-tag-version --allow-same-version
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Đóng gói .pkg macOS
        if: matrix.name == 'macos'
        shell: bash
        run: |
          V="$APP_VERSION"
          mkdir -p out
          for pair in "mac:Intel" "mac-arm64:AppleSilicon"; do
            dir="${pair%%:*}"; label="${pair##*:}"
            pkgbuild --component "dist/$dir/Bartender Lite.app" --install-location /Applications \
              --identifier com.ngthhung.bartenderlite --version "$V" \
              "dist/Bartender-Lite-$V-macOS-$label.pkg"
          done
          ls -la dist/*.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.deb
            dist/*.pkg

  release:
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.setup.outputs.version }}
          name: Bartender Lite ${{ needs.setup.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*
          body: |
            Bo cai tao tu dong (dong Bartender Lite truoc khi cai):

            - Windows 64-bit: file ...-Setup.exe
            - macOS may chip Apple (M1 tro len): file ...-macOS-AppleSilicon.pkg
            - macOS may chip Intel: file ...-macOS-Intel.pkg
            - Linux Mint / Ubuntu / Debian 64-bit: file .deb
              macOS: bo cai chua co chu ky Apple, lan dau bam chuot phai vao file .pkg > Open (hoac System Settings > Privacy & Security > Open Anyway).
